# Serves the built SPA and proxies /api to the backend container — the docker-compose
# equivalent of vite.config.ts's dev-server proxy, so the frontend's relative "/api/..."
# fetch calls work unchanged in both environments.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

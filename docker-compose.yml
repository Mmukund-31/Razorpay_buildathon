services:
  postgres:
    image: postgres:16-alpine
    container_name: recoveryos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recoveryos
      POSTGRES_PASSWORD: recoveryos
      POSTGRES_DB: recoveryos
    ports:
      - "5432:5432"
    volumes:
      - recoveryos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveryos -d recoveryos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Context is the repo root, not ./backend — the Dockerfile also copies ml/ and
      # simulator/ from alongside backend/ (see backend/Dockerfile's own header comment).
      context: .
      dockerfile: backend/Dockerfile
    container_name: recoveryos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveryos:recoveryos@postgres:5432/recoveryos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: recoveryos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  recoveryos-postgres-data:

# Render Blueprint — deploys RecoveryOS as 3 resources: a Postgres database, the backend
# (Docker, self-contained — trains the ML model during the image build, see
# backend/Dockerfile), and the frontend (static site, built against the backend's URL).
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# New -> Blueprint -> select the repo. Render reads this file and provisions all three.
# Secrets (RAZORPAY_*, LLM_API_KEY) are declared with `sync: false` — Render will prompt for
# them in the dashboard at first deploy; they are never read from this file or from git.
#
# Free-tier notes: the free web service spins down after 15 minutes idle and takes ~30-60s to
# wake on the next request (the model is already baked into the image, so it does NOT retrain
# on wake — only the container itself restarts). Render's free Postgres plan (where still
# available) expires after a fixed period; see README.md's Render section for the upgrade
# path if that matters for your submission window.

databases:
  - name: recoveryos-db
    plan: free
    databaseName: recoveryos
    user: recoveryos

services:
  - type: web
    name: recoveryos-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: recoveryos-db
          property: connectionString
      # Render hands out a plain postgresql:// URL; app/core/config.py's field_validator
      # rewrites it to postgresql+asyncpg:// at read time, so no manual edit is needed here.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: recoveryos-frontend
          property: host
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: recoveryos-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: recoveryos-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
